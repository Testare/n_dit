[workspace]
members = ["crates/*"]
default-members = ["crates/n_dit"]
metadata.crane.name = "n_dit_workspace"
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Testare <testare.i9z@gmail.com>"]
repository = "https://github.com/Testare/n_dit"
rust-version = "1.78"
edition = "2021"

[patch.crates-io]
bevy = { git = "https://github.com/Testare/bevy.git", branch = "bevy-0.16-bookmark" }

[workspace.lints.rust]
missing_debug_implementations = "warn"

[workspace.lints.clippy]
single_match = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[workspace.dependencies]
freeform = { version = "0.4", features = ["toml"] }
bevy_query_ext = "0.6"
bevy_yarnspinner = "0.5"
toml = "0.8.22"
workspace-hack = { version = "0.1", path = "crates/workspace-hack" }
crossterm = { version = "0.28.1", features = ["event-stream", "serde"] }
flexi_logger = "0.30"

[workspace.dependencies.bevy]
version = "0.16.0"
default-features = false
features = [
    "bevy_asset",
    "bevy_audio",
    "bevy_remote",
    "bevy_scene",
    "file_watcher",
    "mp3",
    "multi_threaded",

    "bevy_render",        # Needed for charmi render
    "shader_format_glsl", # Needed for charmi render
    "bevy_window",        # Required for render for some reason
]
